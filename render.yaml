# A separate free web service with an externally supplied PostgreSQL database.
projects:
  - name: ReSolv
    environments:
      - name: Production
        services:
          - type: web
            name: resolv-platform-20261021
            runtime: node
            plan: free
            region: singapore
            buildCommand: npm ci --include=dev && npm run db:generate && npm run build
            startCommand: npm run start:render
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: NEXT_TELEMETRY_DISABLED
                value: "1"
