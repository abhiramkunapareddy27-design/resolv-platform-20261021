# A separate free preview deployment. Free Postgres expires after 30 days.
services:
  - type: web
    name: resolv-platform-20261021
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolv-postgres-20261021
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: resolv-postgres-20261021
    plan: free
    region: singapore
    databaseName: resolv
    user: resolv
    ipAllowList: []
